<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Modo TV — carrossel 16:9 (TV 43" Full HD). Medidas em --u para escalar com a tela. */
  :root{ --u: min(1vw, 1.7778vh); --amber:#c9761a; --amber-l:#eba14a; --teal-deep:#0d2b2a; }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:#0b1f1e; color:#eef4f2; overflow:hidden;
    font-family:"IBM Plex Sans", system-ui, sans-serif;}
  #tv{position:fixed; inset:0; display:flex; flex-direction:column;}
  #tv.idle{cursor:none;}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:calc(var(--u)*2);
    padding:calc(var(--u)*1.4) calc(var(--u)*3); background:var(--teal-deep);
    border-bottom:calc(var(--u)*0.25) solid var(--amber); flex:none;}
  .brand{display:flex; align-items:center; gap:calc(var(--u)*1.2);}
  .mark{width:calc(var(--u)*3.2); height:calc(var(--u)*3.2); border-radius:50%; flex:none;
    border:1px solid rgba(238,244,242,.35);
    background:radial-gradient(circle at 50% 50%, transparent 0 8%, rgba(238,244,242,.18) 8% 10%, transparent 10% 24%,
      rgba(238,244,242,.18) 24% 26%, transparent 26% 40%, rgba(238,244,242,.18) 40% 42%, transparent 42%),
      conic-gradient(from 0deg, var(--amber) 0deg, transparent 55deg 360deg), var(--teal-deep);
    animation:sweep 4s linear infinite;}
  @keyframes sweep{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.mark{animation:none;}}
  .brand b{font-family:"IBM Plex Sans Condensed"; font-weight:700; text-transform:uppercase;
    font-size:calc(var(--u)*2); letter-spacing:.02em;}
  .brand span{display:block; font-size:calc(var(--u)*1); color:#a9bfba;}
  .right{display:flex; align-items:center; gap:calc(var(--u)*2.2);}
  .clock{font-family:"IBM Plex Mono"; font-size:calc(var(--u)*2); font-weight:600; font-variant-numeric:tabular-nums;}
  .counter{font-family:"IBM Plex Mono"; font-size:calc(var(--u)*1.2); color:#a9bfba; font-variant-numeric:tabular-nums;}
  .ctrl{display:flex; gap:calc(var(--u)*0.6); transition:opacity .4s;}
  .ctrl button{background:rgba(238,244,242,.08); border:1px solid rgba(238,244,242,.22); color:#eef4f2;
    width:calc(var(--u)*3.2); height:calc(var(--u)*3.2); border-radius:50%; font-size:calc(var(--u)*1.3);
    cursor:pointer; display:grid; place-items:center; padding:0;}
  .ctrl button:hover{background:rgba(238,244,242,.2);}
  #tv.idle .ctrl{opacity:0;}
  .progress{height:calc(var(--u)*0.45); background:rgba(238,244,242,.1); flex:none;}
  .progress i{display:block; height:100%; width:0; background:var(--amber);}
  .stage{position:relative; flex:1; min-height:0;}
  .slide{position:absolute; inset:0; padding:calc(var(--u)*2.6) calc(var(--u)*3.4) calc(var(--u)*2);
    display:flex; flex-direction:column; gap:calc(var(--u)*1.6); opacity:0; transform:translateX(3%);
    transition:opacity .7s ease, transform .7s ease; pointer-events:none;}
  .slide.on{opacity:1; transform:none; pointer-events:auto;}
  .slide.off{opacity:0; transform:translateX(-3%);}
  @media (prefers-reduced-motion: reduce){.slide{transition:opacity .3s; transform:none !important;}}
  .dots{display:flex; gap:calc(var(--u)*0.45); justify-content:center; padding:calc(var(--u)*0.9) 0; flex:none; flex-wrap:wrap;}
  .dots i{width:calc(var(--u)*0.7); height:calc(var(--u)*0.7); border-radius:50%; background:rgba(238,244,242,.2);}
  .dots i.on{background:var(--amber-l); transform:scale(1.3);}
  .hint{position:absolute; left:50%; bottom:calc(var(--u)*3); transform:translateX(-50%); background:rgba(0,0,0,.65);
    color:#fff; padding:calc(var(--u)*0.8) calc(var(--u)*1.6); border-radius:999px; font-size:calc(var(--u)*1.1);
    transition:opacity .5s; pointer-events:none; white-space:nowrap;}

  /* capa */
  .eyebrow{font-family:"IBM Plex Sans Condensed"; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    color:var(--amber-l); font-size:calc(var(--u)*1.35);}
  .cover h2{margin:0; font-family:"IBM Plex Sans Condensed"; font-weight:700; text-transform:uppercase;
    font-size:calc(var(--u)*4.4); line-height:1.02;}
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:calc(var(--u)*1.4);}
  .kpi{background:rgba(238,244,242,.05); border:1px solid rgba(238,244,242,.14); border-radius:calc(var(--u)*1);
    padding:calc(var(--u)*1.6) calc(var(--u)*1.8);}
  .kpi b{display:block; font-family:"IBM Plex Mono"; font-weight:600; font-size:calc(var(--u)*4.6); line-height:1;
    font-variant-numeric:tabular-nums;}
  .kpi b.sm{font-size:calc(var(--u)*3.4); padding:calc(var(--u)*0.6) 0;}
  .kpi span{display:block; margin-top:calc(var(--u)*0.8); font-size:calc(var(--u)*1.2); text-transform:uppercase;
    letter-spacing:.05em; color:#a9bfba;}
  .kpi.hl b{color:var(--amber-l);}
  .split{display:grid; grid-template-columns:1fr 1fr; column-gap:calc(var(--u)*3); row-gap:calc(var(--u)*1.2);
    align-content:start; flex:1; min-height:0;}
  .ufs{display:grid; grid-template-columns:1fr 1fr; column-gap:calc(var(--u)*3);}
  .panel h3{margin:0 0 calc(var(--u)*1.1); font-family:"IBM Plex Sans Condensed"; text-transform:uppercase;
    letter-spacing:.05em; font-size:calc(var(--u)*1.35); color:#a9bfba;}
  .barrow{display:grid; grid-template-columns:calc(var(--u)*15) 1fr calc(var(--u)*3.5); align-items:center;
    gap:calc(var(--u)*1); margin-bottom:calc(var(--u)*0.9);}
  .barrow .lbl{font-size:calc(var(--u)*1.4); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .barrow .trk{height:calc(var(--u)*1.6); background:rgba(238,244,242,.07); border-radius:calc(var(--u)*0.4); overflow:hidden;}
  .barrow .trk i{display:block; height:100%; border-radius:calc(var(--u)*0.4);}
  .barrow .val{font-family:"IBM Plex Mono"; font-size:calc(var(--u)*1.5); font-weight:600; text-align:right;}

  /* oportunidade */
  .top{display:flex; align-items:center; gap:calc(var(--u)*0.8); flex-wrap:wrap;}
  .tag{font-size:calc(var(--u)*1.15); padding:calc(var(--u)*0.35) calc(var(--u)*1); border-radius:999px; font-weight:700;
    text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; background:rgba(238,244,242,.1); color:#eef4f2;}
  .tag.vert{background:transparent; border:2px solid currentColor; filter:brightness(1.7);}
  .tag.uf{font-family:"IBM Plex Mono"; background:#173330; color:#63b8b0;}
  .tag.new{background:var(--amber-l); color:var(--teal-deep);}
  .tag.p-muito-alto{background:#a34a12; color:#fff;} .tag.p-alto{background:#c9761a; color:#fff;}
  .tag.p-medio{background:#a1441f; color:#fff;} .tag.p-baixo{background:#7c8b86; color:#fff;}
  .op h2{margin:0; font-size:calc(var(--u)*3); line-height:1.15; font-weight:700;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .body{display:grid; grid-template-columns:1.05fr 1fr; gap:calc(var(--u)*2.4); flex:1; min-height:0;}
  .body.with-img{grid-template-columns:1fr 1.15fr;}
  .imgs{display:grid; gap:calc(var(--u)*1); min-height:0;}
  .imgs{grid-template-rows:minmax(0,1fr);}
  .imgs.two{grid-template-rows:minmax(0,1.6fr) minmax(0,1fr);}
  .imgs img{width:100%; height:100%; min-height:0; object-fit:cover; border-radius:calc(var(--u)*0.8);
    background:#132f2d; display:block;}
  .text{display:flex; flex-direction:column; gap:calc(var(--u)*1.2); min-height:0; overflow:hidden;}
  .text > *{flex:none;}
  .entry .t{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .sum{margin:0; font-size:calc(var(--u)*1.5); line-height:1.5; color:#c6d6d1;
    display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; overflow:hidden;}
  .body.with-img .sum{-webkit-line-clamp:3;}
  .impact{background:#132f2d; border-left:calc(var(--u)*0.5) solid var(--amber); border-radius:calc(var(--u)*0.8);
    padding:calc(var(--u)*1.4) calc(var(--u)*1.8); display:flex; flex-direction:column; gap:calc(var(--u)*0.8); min-height:0;}
  .impact .head{display:flex; align-items:center; gap:calc(var(--u)*1); flex-wrap:wrap;}
  .impact .lab{font-family:"IBM Plex Sans Condensed"; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--amber-l); font-size:calc(var(--u)*1.3);}
  .impact .dem{align-self:flex-start; font-size:calc(var(--u)*1.2); font-weight:600; background:rgba(238,244,242,.1);
    padding:calc(var(--u)*0.3) calc(var(--u)*1); border-radius:999px;}
  .impact p{margin:0; font-size:calc(var(--u)*1.4); line-height:1.5; color:#e1ebe8;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;}
  .body.with-img .impact p{-webkit-line-clamp:3;}
  .entry{background:#173330; border-radius:calc(var(--u)*0.8); padding:calc(var(--u)*1.1) calc(var(--u)*1.6);
    font-size:calc(var(--u)*1.3); line-height:1.45; color:#d6e4e0;}
  .entry b{display:block; color:#63b8b0; font-size:calc(var(--u)*1.4); font-family:"IBM Plex Sans Condensed";
    text-transform:uppercase; letter-spacing:.04em;}
  .foot{display:flex; justify-content:space-between; align-items:center; gap:calc(var(--u)*1);
    padding-top:calc(var(--u)*1); border-top:1px dashed rgba(238,244,242,.18);
    font-family:"IBM Plex Mono"; font-size:calc(var(--u)*1.2); color:#a9bfba;}
  .foot .sig{font-family:"IBM Plex Sans"; font-style:italic;}
  .empty{display:grid; place-items:center; height:100%; font-size:calc(var(--u)*2); color:#a9bfba;}
</style>
</head>
<body>
<div id="tv">
  <div class="bar">
    <div class="brand"><div class="mark" aria-hidden="true"></div>
      <div><b>Radar Cordeiro</b><span>Inteligência de Mercado · Grupo Cordeiro</span></div></div>
    <div class="right">
      <div class="ctrl">
        <button id="prev" title="Anterior (←)" aria-label="Anterior">◀</button>
        <button id="play" title="Pausar/continuar (espaço)" aria-label="Pausar">❚❚</button>
        <button id="next" title="Próximo (→)" aria-label="Próximo">▶</button>
        <button id="full" title="Tela cheia (F)" aria-label="Tela cheia">⛶</button>
      </div>
      <span class="counter" id="counter">Capa</span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </div>
  <div class="progress"><i id="prog"></i></div>
  <div class="stage" id="stage"></div>
  <div class="dots" id="dots"></div>
  <div class="hint" id="hint">← → navegar · Espaço pausa · F tela cheia</div>
</div>
<script>
(function(){
  var DATA = __DATA__;
  var CFG = __CFG__;   // {coverMs, opMs, refreshMin}
  var startedAt = Date.now();
  var S = {idx:0, playing:true, timer:null, raf:null, t0:0, dur:0};

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function potCls(p){ return "p-" + String(p||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g,"-"); }
  function bars(rows){
    var max = Math.max.apply(null, rows.map(function(r){return r[1];}).concat([1]));
    return rows.map(function(r){
      return '<div class="barrow"><span class="lbl">'+esc(r[0])+'</span><span class="trk"><i style="width:'+
        (r[1]/max*100).toFixed(1)+'%;background:'+r[2]+'"></i></span><span class="val">'+r[1]+'</span></div>';
    }).join("");
  }
  function coverHTML(c){
    return '<div class="cover" style="display:contents"><div><div class="eyebrow">Sinais de demanda · guindastes e área</div>'+
      '<h2>Panorama de oportunidades</h2></div><div class="kpis">'+
      '<div class="kpi"><b>'+c.total+'</b><span>Monitorados</span></div>'+
      '<div class="kpi hl"><b>'+c.high+'</b><span>Alta prioridade</span></div>'+
      '<div class="kpi"><b>'+c["new"]+'</b><span>Novos na semana</span></div>'+
      '<div class="kpi"><b class="sm">'+esc(c.updated)+'</b><span>Última atualização</span></div></div>'+
      '<div class="split"><div class="panel"><h3>Por potencial</h3>'+bars(c.by_potential)+'</div>'+
      '<div class="panel"><h3>Por vertical</h3>'+bars(c.by_vertical)+'</div>'+
      (c.by_uf.length ? '<div class="panel" style="grid-column:1/-1"><h3>Estados com mais sinais</h3><div class="ufs">'+bars(c.by_uf)+'</div></div>' : '')+
      '</div></div>';
  }
  function opHTML(d){
    var imgs = (d.images||[]).map(function(u){ return '<img src="'+esc(u)+'" alt="" onerror="this.remove()">'; }).join("");
    var ufs = d.ufs.map(function(u){ return '<span class="tag uf">'+esc(u)+'</span>'; }).join("");
    return '<div class="op" style="display:contents"><div class="top">'+
      '<span class="tag '+potCls(d.potential)+'">Potencial '+esc(d.potential)+'</span>'+
      (d.isNew ? '<span class="tag new">Novo na semana</span>' : '')+
      (d.vertical ? '<span class="tag vert" style="color:'+d.vertColor+'">'+esc(d.vertical)+'</span>' : '')+
      (d.category ? '<span class="tag">'+esc(d.category)+'</span>' : '')+ufs+'</div>'+
      '<h2>'+esc(d.title)+'</h2>'+
      '<div class="body'+(imgs ? ' with-img' : '')+'">'+
        (imgs ? '<div class="imgs'+(d.images.length > 1 ? ' two' : '')+'">'+imgs+'</div>' : '<p class="sum">'+esc(d.summary)+'</p>')+
        '<div class="text">'+(imgs ? '<p class="sum">'+esc(d.summary)+'</p>' : '')+
          (d.impacto ? '<div class="impact"><div class="head"><span class="lab">💡 Impacto para a Cordeiro</span>'+
            '<span class="dem">Demanda de guindaste/área: '+esc(d.demand)+'</span></div><p>'+esc(d.impacto)+'</p></div>' : '')+
          '<div class="entry"><b>Entrada da Cordeiro · '+esc(d.entrada)+'</b><span class="t">'+esc(d.fase)+' · '+esc(d.executor)+'</span></div>'+
        '</div></div>'+
      '<div class="foot"><span>'+esc(d.source)+' · '+esc(d.date)+'</span><span class="sig">'+esc(d.signal)+'</span></div></div>';
  }

  var deck = [{type:"cover"}].concat(DATA.slides.map(function(s){ return {type:"op", doc:s}; }));
  var stage = document.getElementById("stage");
  stage.innerHTML = deck.map(function(s){
    return '<section class="slide">'+(s.type==="cover" ? coverHTML(DATA.cover) : opHTML(s.doc))+'</section>';
  }).join("");
  document.getElementById("dots").innerHTML = deck.map(function(){ return "<i></i>"; }).join("");
  if(!DATA.slides.length){
    stage.insertAdjacentHTML("beforeend", '<div class="empty" style="position:absolute;inset:auto 0 8% 0;height:auto">Nenhuma oportunidade de Alto potencial ou nova na semana.</div>');
  }

  // Encaixa o texto de cada slide: reduz linhas do resumo e depois do impacto até caber, sem cortar no meio.
  function fit(){
    stage.querySelectorAll(".slide").forEach(function(sl){
      var col = sl.querySelector(".text"); if(!col) return;
      var sum = col.querySelector(".sum"), imp = col.querySelector(".impact p");
      var sumL = 4, impL = 5;
      function apply(){ if(sum) sum.style.webkitLineClamp = sumL; if(imp) imp.style.webkitLineClamp = impL; }
      apply();
      while(col.scrollHeight > col.clientHeight + 1){
        if(sum && sumL > 2) sumL--;
        else if(imp && impL > 2) impL--;
        else if(sum && sumL > 1) sumL--;
        else break;
        apply();
      }
    });
  }
  fit(); window.addEventListener("resize", fit);
  if(document.fonts) document.fonts.ready.then(fit);

  function reloadPage(){
    // Recarrega o painel Streamlit (dados novos da coleta). Se o iframe não puder, recarrega só o carrossel.
    try{ window.top.location.reload(); }catch(e){ location.reload(); }
  }
  function show(i){
    var n = deck.length;
    i = ((i % n) + n) % n;
    if(i === 0 && S.idx !== 0 && (Date.now() - startedAt) > CFG.refreshMin*60000){ reloadPage(); return; }
    var slides = stage.querySelectorAll(".slide");
    slides.forEach(function(s,k){ s.classList.toggle("on", k===i); s.classList.toggle("off", k!==i && s.classList.contains("on")); });
    setTimeout(function(){ slides.forEach(function(s,k){ if(k!==i) s.classList.remove("off"); }); }, 750);
    document.querySelectorAll("#dots i").forEach(function(d,k){ d.classList.toggle("on", k===i); });
    document.getElementById("counter").textContent = i===0 ? "Capa" : (i+" / "+(n-1));
    S.idx = i;
    S.dur = deck[i].type === "cover" ? CFG.coverMs : CFG.opMs;
    restart();
  }
  function restart(){
    clearTimeout(S.timer); cancelAnimationFrame(S.raf);
    var bar = document.getElementById("prog");
    if(!S.playing) return;
    S.t0 = performance.now();
    S.timer = setTimeout(function(){ show(S.idx+1); }, S.dur);
    (function tick(){
      var p = Math.min(1, (performance.now()-S.t0)/S.dur);
      bar.style.width = (p*100).toFixed(2)+"%";
      if(p < 1 && S.playing) S.raf = requestAnimationFrame(tick);
    })();
  }
  function togglePlay(){
    S.playing = !S.playing;
    var b = document.getElementById("play");
    b.innerHTML = S.playing ? "&#10074;&#10074;" : "&#9654;&#xFE0E;";
    if(S.playing) restart(); else { clearTimeout(S.timer); cancelAnimationFrame(S.raf); }
  }
  function fullscreen(){
    var el = document.documentElement;
    try{
      var topDoc = window.top.document;
      if(topDoc.fullscreenElement){ topDoc.exitFullscreen(); return; }
      el = topDoc.documentElement;
    }catch(e){}
    if(document.fullscreenElement){ document.exitFullscreen(); return; }
    if(el.requestFullscreen) el.requestFullscreen().catch(function(){});
  }
  function clock(){
    document.getElementById("clock").textContent =
      new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Fortaleza"});
  }
  var tv = document.getElementById("tv"), hint = document.getElementById("hint"), idleT;
  function wake(){
    tv.classList.remove("idle"); hint.style.opacity = "1"; clearTimeout(idleT);
    idleT = setTimeout(function(){ tv.classList.add("idle"); hint.style.opacity = "0"; }, 4000);
  }
  document.getElementById("prev").onclick = function(){ show(S.idx-1); };
  document.getElementById("next").onclick = function(){ show(S.idx+1); };
  document.getElementById("play").onclick = togglePlay;
  document.getElementById("full").onclick = fullscreen;
  document.addEventListener("mousemove", wake);
  document.addEventListener("keydown", function(e){
    if(e.key === "ArrowRight"){ show(S.idx+1); }
    else if(e.key === "ArrowLeft"){ show(S.idx-1); }
    else if(e.key === " "){ e.preventDefault(); togglePlay(); }
    else if(e.key === "f" || e.key === "F"){ fullscreen(); }
    else return;
    wake();
  });
  clock(); setInterval(clock, 15000);
  wake();
  show(0);
})();
</script>
</body>
</html>
