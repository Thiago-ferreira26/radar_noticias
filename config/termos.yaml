# Termos de busca do Radar Cordeiro.
# Pode ser editado aqui ou na aba "Configuração" do painel.
#  - exa: true      -> o termo concorre às buscas Exa (máx. 5 por dia; rodízio diário se houver mais)
#  - firecrawl: true -> o termo concorre às buscas Firecrawl (sem nenhum marcado: todos, por prioridade)
#  - prioridade     -> 1 = mais importante (ordem de escolha para o Exa e o Firecrawl)
#  - ativo: false   -> mantém o termo no arquivo sem buscar
exa:
  limite_diario: 5          # nunca passa de 5, mesmo que se coloque um número maior
  dias_retroativos: 7       # notícias publicadas nos últimos N dias
  resultados_por_busca: 10
ddg:
  regiao: br-pt             # Brasil, português
  periodo: w                # d = dia, w = semana, m = mês
  resultados_por_busca: 15
  pausa_segundos: 2         # intervalo entre buscas para evitar bloqueio
firecrawl:
  ativo: true
  limite_diario: 10         # buscas por dia; cada busca consome créditos (~2 por 10 notícias)
  resultados_por_busca: 10
  periodo: w                # d = dia, w = semana, m = mês
# Fontes diretas por RSS: lidas a cada coleta, sem custo de API (notícias dos últimos N dias).
rss:
  dias_retroativos: 14
fontes_rss:
  - {nome: Brasil Mineral, url: "https://brasilmineral.com.br/feed/", tema: Mineração, ativo: true}
  - {nome: InfraNews, url: "https://infranews.com.br/feed/", tema: Infraestrutura, ativo: true}
  - {nome: BVMI, url: "https://bvmi.com.br/feed/", tema: Industrial, ativo: true}
  # Movimento Econômico: feeds por editoria (o feed geral mistura política, consumo e turismo)
  - {nome: Movimento Econômico, url: "https://movimentoeconomico.com.br/economia/portos/feed/", tema: Portos, ativo: true}
  - {nome: Movimento Econômico, url: "https://movimentoeconomico.com.br/economia/energia/feed/", tema: Energia, ativo: true}
  - {nome: Movimento Econômico, url: "https://movimentoeconomico.com.br/economia/infraestrutura/feed/", tema: Infraestrutura, ativo: true}
  - {nome: Movimento Econômico, url: "https://movimentoeconomico.com.br/economia/industria-empresas/feed/", tema: Industrial, ativo: true}
# Fontes avaliadas e não incluídas como feed (aparecem na janela "Fontes de dados" do painel).
fontes_nao_incluidas:
  - {nome: Valor Econômico, url: "https://valor.globo.com", motivo: "Feed geral (política, varejo…), quase só ruído; notícias chegam pelas buscas"}
  - {nome: Exame (Melhores e Maiores), url: "https://exame.com", motivo: "Feed geral, poucas notícias aproveitáveis; chegam pelas buscas"}
  - {nome: Nordeste Investing, url: "https://nordesteinvesting.com.br", motivo: "Feed do site com erro (HTTP 500); notícias chegam pelas buscas"}
  - {nome: CanalEnergia, url: "https://www.canalenergia.com.br", motivo: "Feed do site vazio; notícias chegam pelas buscas"}
  - {nome: Diário do Pará, url: "https://diariodopara.com.br", motivo: "Feed geral político e sem feed de economia; coberto por buscas direcionadas (site:) no DuckDuckGo"}
  - {nome: Poder360, url: "https://www.poder360.com.br", motivo: "Feed geral político e feeds de Infra/Energia/Economia vazios; coberto por buscas direcionadas (site:)"}
# Nota 0–10 de cada notícia (chance de virar relacionamento e demanda): peso máximo de cada critério.
# Os pesos são reescalados para somar 10. Também editável na aba "Configuração".
nota:
  pesos: {demanda: 2.5, fase: 2.5, regiao: 1.5, contato: 1.5, porte: 1.0, prazo: 1.0}
classificacao:
  ufs_prioritarias: [CE, PA]
  ufs_atuacao: [MA, PI, RN, PB, PE, AL, SE, BA]
  porte_relevante_milhoes: 100
# Notícias com estas palavras (inteiras) ficam fora do Radar: na coleta nem entram; as já gravadas ficam ocultas.
excluir_se_contiver:
  # esporte
  - futebol
  - golaço
  - campeonato
  - brasileirão
  - libertadores
  - jogador
  - atacante
  - zagueiro
  - goleiro
  - torcida
  - cristiano ronaldo
  - neymar
  - stjd
  # entretenimento
  - novela
  - horóscopo
  - reality show
  # eleições
  - zona eleitoral
  - local de votação
  # crimes e acidentes
  - detido
  - suspeito de
  - homicídio
  - assalto
  - despiste
  - morre em
  - morre após
  # listas e mercado financeiro sem obra
  - licitações de saúde
  - licitações de alimentação
  - limpeza & conservação
  - valor de mercado
temas:
  - nome: Energia
    termos:
      - {texto: parque eólico Ceará, exa: true, prioridade: 1}
      - {texto: hidrogênio verde Pecém, exa: true, prioridade: 2}
      - {texto: usina solar Ceará, prioridade: 3}
      - {texto: linha de transmissão Nordeste, prioridade: 3}
      - {texto: energia Pará investimento, prioridade: 3}
      - {texto: data center Pecém, prioridade: 2}
  - nome: Portos
    termos:
      - {texto: Porto do Pecém, exa: true, prioridade: 1}
      - {texto: Porto de Vila do Conde, prioridade: 2}
      - {texto: terminal portuário Pará, prioridade: 2}
      - {texto: Porto de Fortaleza, prioridade: 3}
  - nome: Mineração
    termos:
      - {texto: mineração Pará investimento, exa: true, prioridade: 1}
      - {texto: mineradora Ceará, prioridade: 2}
      - {texto: siderúrgica Pecém, prioridade: 2}
      - {texto: projeto de mineração investimento, prioridade: 3}
  - nome: Industrial
    termos:
      - {texto: nova fábrica Ceará, exa: true, prioridade: 1}
      - {texto: nova fábrica Pará, prioridade: 2}
      - {texto: ZPE Ceará, prioridade: 3}
      - {texto: investimento industrial Nordeste, prioridade: 3}
  - nome: Óleo & Gás
    termos:
      - {texto: Margem Equatorial Petrobras, prioridade: 2}
      - {texto: gasoduto Nordeste, prioridade: 3}
  - nome: Logística/Hidrovias
    termos:
      - {texto: Transnordestina obras, prioridade: 2}
      - {texto: ferrovia Pará, prioridade: 2}
      - {texto: hidrovia Tapajós, prioridade: 3}
  - nome: Saneamento
    termos:
      - {texto: dessalinização Fortaleza, prioridade: 3}
      - {texto: saneamento Ceará obras, prioridade: 3}
  - nome: Infraestrutura
    termos:
      - {texto: obras Ceará investimento, prioridade: 2}
      - {texto: obras Pará investimento, prioridade: 3}
      - {texto: concessão infraestrutura Nordeste, prioridade: 3}
  - nome: Buscas direcionadas
    termos:
      # Sites sem feed útil (feed geral político ou editorias vazias): busca restrita ao site.
      - {texto: "site:diariodopara.com.br mineração", prioridade: 3}
      - {texto: "site:diariodopara.com.br obras investimento", prioridade: 3}
      - {texto: "site:diariodopara.com.br energia usina", prioridade: 3}
      - {texto: "site:diariodopara.com.br porto Barcarena", prioridade: 3}
      - {texto: "site:poder360.com.br infraestrutura obras", prioridade: 3}
      - {texto: "site:poder360.com.br leilão porto rodovia", prioridade: 3}
      - {texto: "site:poder360.com.br energia transmissão usina", prioridade: 3}
